<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML and CSS Quiz</title>
    <link rel="stylesheet" href="/wdd130/week05/styles/quiz.css">
</head>

<body>
    <div class="quiz-wrapper">

        <h1 class="quiz-title"><span class="checkbox-icon">&#10004;</span>Basic HTML and CSS Quiz
        </h1>

        <form class="quiz-container">

            <div class="form-group">
                <label class="question-label" for="q1">1. What does the acronym CSS stand
                    for?</label>
                <input type="text" id="q1" class="form-input">
            </div>

            <div class="from-group">
                <label class="question-label" for="q2">2. How are id and class attributes selected
                    in CSS?</label>
                <textarea id="q2" class="form-textarea"></textarea>
            </div>

            <div class="form-group">
                <label class="question-label" for="q3">3. Which of the following is a valid CSS
                    comment?</label>
                <div class="select-wrapper">
                    <select id="q3" class="form-select">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="a">/* Ths is the comment */</option>
                        <option value="b">&lt;!-- This is a comment --&gt;</option>
                        <option value="c">// This is a comment //</option>
                    </select>
                </div>
            </div>

            <div class="from-group">
                <label class="question-label" for="q4">4. What is the bottom margin (in pixels)
                    given the declaration?
                </label>

                <div class="code-box-container">
                    <div class="code-box">
                        <code>margin: 1px 5px 15px;</code>
                    </div>
                </div>
                <input type="text" id="q4" class="form-input">

            </div>

            <button type="submit" class="submit-btn">Submit Quiz</button>


        </form>

    </div>

</body>

</html>
