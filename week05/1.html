<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
    <link rel="stylesheet" href="/week05/styles/1.css">
</head>

<body>

    <main class="form-container">
        <h1>WDD 130 | HTML Form - User Poll</h1>

        <form action="#" method="post">

            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <div class="form-group row">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                    </select>
                </div>

                <div class="form-group row">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="form-group column">
                    <label for="places">List the places you have lived:</label>
                    <textarea id="places" name="places"
                      placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
                </div>
            </fieldset>

            <div class="button-container">
                <button type="submit">Submit Poll</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy;2024 | HTML Form - User Poll Activity | Xavier Rodriquez</p>
    </footer>

</body>

</html>
